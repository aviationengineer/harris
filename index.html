 // timers

  if(p.vy>0&&prevBottom<=s.y+10){p.y=s.y-p.h;if(s.type==='spring'){p.vy=-16;AudioSys.sfx('jump');}else{p.vy=0;p.onGround=true;standing=s;if(s.type==='falling'){s._fall=true;s._fallT=70;}if(s.type==='mystery'&&!s._used){/* bump handled below */}}}

 if(standing&&standing.type==='moving')p.x+=standing._dx||0;

 // enemies
 for(const e of G.enemies){if(!e.alive)continue;e.t++;

  else if(e.type==='shieldbot'){e.x+=e.dir*0.4;if(e.t%200===0)e.dir*=-1;}

   if(G.boss&&false){}
